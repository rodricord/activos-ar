<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR - Control de Activos</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

  <a-scene 
    mindar-image="imageTargetSrc: ./doctorsv.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Detección del sticker -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Contenedor que levanta la ficha 90 grados para que quede vertical sobre el equipo -->
      <a-entity rotation="90 0 0" position="0 0 0.45">

        <!-- Tarjeta visual flotante con movimiento oscilante tipo ventilador -->
        <a-plane 
          color="#0F172A" 
          height="1.35" 
          width="1.15" 
          position="0 0 0" 
          scale="0.65 0.65 0.65"
          animation="property: rotation; from: 0 -25 0; to: 0 25 0; dur: 2500; dir: alternate; loop: true; easing: easeInOutSine">
          
          <a-text value="FICHA DEL EQUIPO" color="#38BDF8" align="center" width="1.3" position="0 0.57 0.01"></a-text>
          <a-plane color="#38BDF8" height="0.008" width="0.95" position="0 0.50 0.01"></a-plane>

          <!-- Datos de texto del equipo -->
          <a-text 
            id="info-texto" 
            value="Cargando datos..." 
            color="#FFFFFF" 
            align="left" 
            width="1.2" 
            position="-0.5 0.25 0.01">
          </a-text>

          <!-- Imagen del equipo debajo del último campo -->
          <a-image 
            id="info-imagen" 
            src="" 
            crossorigin="anonymous"
            width="0.65" 
            height="0.45" 
            position="0 -0.32 0.02" 
            visible="false">
          </a-image>

        </a-plane>

      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const URL_API = "https://script.google.com/macros/s/AKfycbyUCYfL5hW9PTZJmSvjVe2vJlszLy5aAz4Sadovh6BuEGcbUEeu8RXXKmSOROKBrtqy/exec";

    async function obtenerDatos() {
      const textoElemento = document.querySelector('#info-texto');
      const imagenElemento = document.querySelector('#info-imagen');

      try {
        const parametros = new URLSearchParams(window.location.search);
        const idBuscado = parametros.get('id');

        const urlConsulta = idBuscado 
          ? `${URL_API}?id=${encodeURIComponent(idBuscado)}` 
          : URL_API;

        const respuesta = await fetch(urlConsulta);
        const filas = await respuesta.json();
        const equipo = filas[0];

        if (!equipo) {
          textoElemento.setAttribute("value", `Activo ${idBuscado} no encontrado en Sheets.`);
          return;
        }

        const areaValor = equipo["ÁREA"] || equipo["AREA"] || equipo["Área"] || "Sin dato";

        textoElemento.setAttribute("value", 
          `Activo Fijo: ${equipo["ACTIVO FIJO"]}\n` +
          `Equipo: ${equipo["EQUIPO"]}\n` +
          `Modelo: ${equipo["MODELO"]}\n` +
          `Area: ${areaValor}\n` +
          `Estado: ${equipo["ESTADO"]}`
        );

        // Si la columna IMAGEN tiene una URL válida, la carga y la hace visible en AR
        const urlImagen = equipo["IMAGEN"] ? equipo["IMAGEN"].toString().trim() : "";
        if (urlImagen.startsWith("http")) {
          imagenElemento.setAttribute("src", urlImagen);
          imagenElemento.setAttribute("visible", "true");
        } else {
          imagenElemento.setAttribute("visible", "false");
        }

      } catch (error) {
        textoElemento.setAttribute("value", "Error al leer Google Sheets.");
      }
    }

    obtenerDatos();
  </script>

</body>
</html>
